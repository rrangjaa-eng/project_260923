<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도우미 시작</title></head><body>
<main><h1>도우미 시작</h1><p id="status" role="status">스페이스바로 시작하세요. 찾기에서 검색어를 쓰고 적용한 뒤 검색을 선택하세요.</p>
<form action="https://www.google.com/search" method="get"><label for="query">Google 검색어</label><input id="query" name="q" type="search" autocomplete="off"><button type="submit">Google에서 검색</button></form>
<form id="address-form"><label for="address">페이지 주소</label><input id="address" type="url" autocomplete="off" placeholder="https://"><button type="submit">주소로 이동</button></form>
<p>검색이나 이동을 선택할 때 해당 사이트를 엽니다. 입력 중에는 전송하지 않아요.</p></main>
<script type="module" src="./main.ts"></script></body></html>
