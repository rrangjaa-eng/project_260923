<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>5,000요소 큰 페이지(강조 반응 시간 측정)</title>
    <style>
      body {
        margin: 0;
        position: relative;
      }
      [data-el] {
        position: absolute;
        box-sizing: border-box;
        font-size: 10px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!--
      D-04·D-05·D-28, RESEARCH.md Pitfall 6: 누를 수 있는 요소 5,000개(버튼·링크·입력칸 섞어
      격자, 화면 여러 장 높이) + 화면 변화 부하 모드(?churn=1). 페이지가 받은 진짜(isTrusted)
      pointermove의 timeStamp부터 오버레이 강조 테두리([data-part="ring"], 도우미의 shadow
      root 안)의 style·data-* 변경까지(둘 다 같은 문서 시계 performance.now())를 반응 시간
      표본으로 남긴다 — 테두리 이동 모션(80ms, SYSTEM.md)은 포함하지 않는다(그 시점 이후의
      transition은 재지 않는다, 계획 "가정" 문단).
    -->
    <script>
      var COLS = 25;
      var ROWS = 200; // COLS * ROWS = 5,000
      var CELL_W = 50;
      var CELL_H = 40;
      var TOTAL = COLS * ROWS;

      function baseLeft(idx) {
        return (idx % COLS) * CELL_W + 5;
      }
      function baseTop(idx) {
        return Math.floor(idx / COLS) * CELL_H + 6;
      }

      for (var i = 0; i < TOTAL; i += 1) {
        var kindRoll = i % 10;
        var el;
        if (kindRoll < 7) {
          el = document.createElement('button');
          el.textContent = String(i);
        } else if (kindRoll < 9) {
          el = document.createElement('a');
          el.href = '#el-' + String(i);
          el.textContent = String(i);
        } else {
          el = document.createElement('input');
          el.type = 'text';
        }
        el.id = 'el-' + String(i);
        el.dataset.el = '';
        el.style.left = baseLeft(i) + 'px';
        el.style.top = baseTop(i) + 'px';
        el.style.width = '40px';
        el.style.height = '28px';
        document.body.appendChild(el);
      }

      // 측정기 1/2 — 페이지가 받은 마지막 진짜 pointermove의 timeStamp(도우미는 pointermove를
      // 막지 않는다, capture 리스너라 도우미보다 먼저 받을 수도 있지만 timeStamp 자체는 동일).
      window.__lastPointerMoveTs = null;
      window.addEventListener(
        'pointermove',
        function (e) {
          window.__lastPointerMoveTs = e.timeStamp;
        },
        true,
      );

      // 측정기 2/2 — 강조 테두리의 attribute 변경을 MutationObserver로 본다. 한 번 쓰면
      // __lastPointerMoveTs를 바로 null로 되돌린다("소비형" 플래그): 부하 모드에서 우리가
      // 움직이지 않은 사이에 배경 화면 변화(churn)만으로 같은 대상의 테두리가 다시 그려져도
      // (자석 재계산이 그 순간의 사각형으로 다시 그린다, D-12·D-04) 표본으로 잘못 잡히지 않는다
      // — 이미 소비된 뒤라 __lastPointerMoveTs가 null이면 표본을 남기지 않는다.
      window.__reactionSamples = [];
      window.__ringObserverAttached = false;
      function attachRingObserver() {
        var host = document.querySelector('tremor-helper-root');
        var ring = host && host.shadowRoot && host.shadowRoot.querySelector('[data-part="ring"]');
        if (!ring) {
          requestAnimationFrame(attachRingObserver);
          return;
        }
        var observer = new MutationObserver(function () {
          if (window.__lastPointerMoveTs !== null) {
            window.__reactionSamples.push(performance.now() - window.__lastPointerMoveTs);
            window.__lastPointerMoveTs = null;
          }
        });
        observer.observe(ring, { attributes: true, attributeFilter: ['style', 'class', 'data-visible', 'data-danger'] });
        window.__ringObserverAttached = true;
      }
      attachRingObserver();

      // 부하 모드(?churn=1, D-05 "화면이 바뀌면" 부하 흉내): 100ms마다 무작위 요소 100개의
      // 글자(버튼·링크)·자리(모든 종류, 원래 칸 안에서 살짝 흔든다)를 바꿔 MutationObserver를
      // 계속 흔든다(collector.ts의 재수집 경로를 실제로 태운다).
      if (new URLSearchParams(location.search).get('churn') === '1') {
        setInterval(function () {
          var jitter = Math.floor(Date.now() / 100) % 2 === 0 ? 2 : 0;
          for (var k = 0; k < 100; k += 1) {
            var idx = Math.floor(Math.random() * TOTAL);
            var target = document.getElementById('el-' + String(idx));
            if (!target) {
              continue;
            }
            if (target.tagName !== 'INPUT') {
              target.textContent = 'x' + String(Date.now() % 1000);
            }
            target.style.left = baseLeft(idx) + jitter + 'px';
            target.style.top = baseTop(idx) + jitter + 'px';
          }
        }, 100);
      }
    </script>
  </body>
</html>
