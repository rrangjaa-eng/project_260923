<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>위험한 버튼 연습</title>
  </head>
  <body style="margin: 0">
    <script>
      // D-28: practice.test·other.test 모두에서 이 파일 하나로 서빙된다. ?child=1이면 다른 출처
      // iframe 안 위험한 버튼 하나만 그린다(Plan 01-09 확인 화면 시험용, 이 계획의 e2e는 쓰지 않음).
      var params = new URLSearchParams(location.search);
      var child = params.get('child');

      // Plan 01-09 behavior 7·Task 3 behavior 3: 확인 화면이 떠 있는 동안 사이트가 키 입력을
      // 받지 않음을 확인하는 카운터(도우미가 도우미 모드일 때 여는 확인 화면이 모든 isTrusted
      // 키를 삼켜야 이 카운터가 늘지 않는다). shortcuts.html의 site-keydown과 같은 패턴.
      var siteKeydownCount = 0;
      window.addEventListener(
        'keydown',
        function () {
          siteKeydownCount += 1;
          var el = document.getElementById('site-keydown');
          if (el) {
            el.textContent = String(siteKeydownCount);
          }
        },
        true,
      );

      function makeButton(id, text, x, y, w, h) {
        var btn = document.createElement('button');
        btn.id = id;
        btn.textContent = text;
        btn.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;padding:0;margin:0';
        var count = document.createElement('span');
        count.id = id + '-count';
        count.textContent = '0';
        count.style.cssText = 'position:absolute;left:' + x + 'px;top:' + (y + h + 4) + 'px';
        var n = 0;
        btn.addEventListener('click', function () {
          n += 1;
          count.textContent = String(n);
        });
        document.body.append(btn, count);
      }

      function makeLink(id, text, x, y) {
        var a = document.createElement('a');
        a.id = id;
        a.href = '#';
        a.textContent = text;
        a.style.cssText = 'position:absolute;left:' + x + 'px;top:' + y + 'px';
        var count = document.createElement('span');
        count.id = id + '-count';
        count.textContent = '0';
        count.style.cssText = 'position:absolute;left:' + x + 'px;top:' + (y + 24) + 'px';
        var n = 0;
        a.addEventListener('click', function (event) {
          event.preventDefault();
          n += 1;
          count.textContent = String(n);
        });
        document.body.append(a, count);
      }

      if (child === '1') {
        // 다른 출처 iframe 안 위험한 버튼 하나(Plan 01-09용).
        makeButton('btn-child-delete', '삭제', 0, 0, 60, 30);
        var childCounter = document.createElement('span');
        childCounter.id = 'site-keydown';
        childCounter.textContent = '0';
        childCounter.style.cssText = 'position:absolute;left:0px;top:120px';
        document.body.append(childCounter);
      } else {
        // 각 줄은 90px씩 떨어져 있다 — 시험은 항상 커서를 가로(같은 세로 가운데)로만 옮겨
        // 다른 줄의 요소가 잡는 범위(기본 48px)에 걸리지 않게 한다.

        // 왼쪽 150px을 비워 둔다 — 시험이 요소 왼쪽으로 최대 30px까지 커서를 옮기는데, x=0에
        // 붙은 요소는 그 방향으로 옮기면 화면 좌표가 음수가 되어 마우스 이벤트 자체가 페이지에
        // 닿지 않는다(재현 확인, Rule 1). 저장 옆 삭제(테두리 사이 40px 간격): 저장
        // x=150~210, 삭제 x=250~310.
        makeButton('btn-save', '저장', 150, 0, 60, 30);
        makeButton('btn-delete-paired', '삭제', 250, 0, 60, 30);

        // 따로 떨어진 삭제(주변 비움) — 정확히 위·5px 밖 시험용.
        makeButton('btn-delete-solo', '삭제', 150, 90, 60, 30);

        makeButton('btn-cancel-approval', '결재 취소', 150, 180, 100, 30);
        makeLink('link-logout', '로그아웃', 150, 270);
        makeButton('btn-reject', '반려', 150, 360, 60, 30);
        makeButton('btn-submit', '상신', 150, 450, 60, 30);
        makeButton('btn-hold', '보류', 150, 540, 60, 30);

        var topCounter = document.createElement('span');
        topCounter.id = 'site-keydown';
        topCounter.textContent = '0';
        topCounter.style.cssText = 'position:absolute;left:150px;top:630px';
        document.body.append(topCounter);

        var frame = document.createElement('iframe');
        frame.id = 'frame-child';
        frame.title = '다른 출처 위험한 버튼';
        frame.src = 'http://other.test/danger.html?child=1';
        frame.style.cssText = 'position:absolute;left:400px;top:0px;width:200px;height:200px;border:0';
        document.body.append(frame);
      }
    </script>
  </body>
</html>
