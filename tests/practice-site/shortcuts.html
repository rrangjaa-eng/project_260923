<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>사이트 단축키 연습</title>
    <script>
      // D-17, 설계 11장 ④: 사이트가 window capture로 keydown을 가로채려 하고, keypress·keyup에도
      // 반응하는 상황을 흉내 낸다. 도우미 모드에서는 도우미 키(스페이스바·숫자)가 이 사이트
      // 단축키보다 먼저 받아야 한다(KEY-02) — content script는 document_start에 등록돼 이 스크립트
      // (문서 파싱 중 실행)보다 항상 먼저다.
      function isShortcutCode(code) {
        return code === 'Space' || (typeof code === 'string' && /^Digit[1-9]$/.test(code));
      }

      function bump(id) {
        var el = document.getElementById(id);
        if (!el) {
          return;
        }
        el.textContent = String(Number(el.textContent) + 1);
      }

      window.addEventListener(
        'keydown',
        function (e) {
          if (isShortcutCode(e.code)) {
            bump('site-keydown');
          }
        },
        true,
      );

      document.addEventListener('keypress', function (e) {
        if (isShortcutCode(e.code)) {
          bump('site-keypress');
        }
      });

      document.addEventListener('keyup', function (e) {
        if (isShortcutCode(e.code)) {
          bump('site-keyup');
        }
      });
    </script>
  </head>
  <body>
    <button id="target" style="position: fixed; left: 40px; top: 40px; width: 80px; height: 30px">버튼</button>
    <span id="target-count">0</span>

    <span id="site-keydown">0</span>
    <span id="site-keypress">0</span>
    <span id="site-keyup">0</span>

    <input id="text-input" type="text" style="position: fixed; left: 40px; top: 100px" />

    <script>
      var targetCountEl = document.getElementById('target-count');
      var targetCount = 0;
      document.getElementById('target').addEventListener('click', function () {
        targetCount += 1;
        targetCountEl.textContent = String(targetCount);
      });
    </script>
  </body>
</html>
